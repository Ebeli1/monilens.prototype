<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoniLens prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F0;--card:#fff;--ink:#14201B;--mute:#65746D;--line:#DCE4DE;--brand:#0D1B2A;--on:#fff;--mint:#00C896;--me:#0F4C3A;--bot:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1410;--card:#15211B;--ink:#EAF1EC;--mute:#8FA097;--line:#243229;--brand:#0B7A5C;--bot:#15211B}}
:root[data-theme="dark"]{--bg:#0C1410;--card:#15211B;--ink:#EAF1EC;--mute:#8FA097;--line:#243229;--brand:#0B7A5C;--bot:#15211B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
header{padding:14px 20px 10px;display:flex;align-items:center;gap:10px}
.hl{width:32px;height:32px;border-radius:8px}
header b{font-size:18px;letter-spacing:-.3px}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
.pg{display:none}.pg.on{display:block}
#chat.on{display:flex;flex-direction:column;min-height:100%}
#msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.m{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.4;white-space:pre-line;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.m.b{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.u{background:var(--me);color:var(--on);border-bottom-right-radius:5px;align-self:flex-end}
.m .act{display:block;margin-top:10px;background:var(--mint);color:#14201B;border:0;border-radius:99px;padding:8px 14px;font:700 14px inherit;font-family:inherit}
.dots{display:flex;gap:4px;padding:14px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font:inherit;font-size:13.5px}
.cbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:4px}
.cbar input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:13px 18px;font:inherit;outline:0}
.cbar input:focus,.btn:focus-visible,.chip:focus-visible,nav button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.send{width:46px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 9px;font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}
:root[data-theme="dark"] nav button.on,@media (prefers-color-scheme:dark){nav button.on{color:var(--mint)}}
h2{font-size:26px;letter-spacing:-.6px;margin:8px 0 14px}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.goal{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.goal .e{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.goal .t{flex:1}.goal small,.mute{color:var(--mute)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
:root[data-theme="dark"] .bar i{background:var(--mint)}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.btn{width:100%;border:0;border-radius:14px;background:var(--brand);color:#fff;padding:14px;font:700 15px inherit;font-family:inherit}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.back{border:0;background:none;color:var(--mute);font:inherit;padding:4px 0 0}
input.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;margin-bottom:8px}
.steps{display:flex;flex-direction:column;gap:0}.st{display:flex;gap:12px;align-items:center;padding:6px 0}
.st u{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;text-decoration:none;position:relative}
.st.d u{background:var(--brand);border-color:var(--brand)}.st.now u{border-color:#F2B632;background:#F2B632}
.st.now b{color:var(--ink)}.st{color:var(--mute)}
.pos{background:var(--brand);color:#fff;border-radius:18px;padding:20px;margin-bottom:10px}.pos .big{font-size:52px;color:var(--mint)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mute)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--brand)}.sw.on:after{left:21px}
.av{width:64px;height:64px;border-radius:50%;background:var(--mint);color:#14201B;display:grid;place-items:center;font-size:26px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#gate{position:fixed;inset:0;z-index:10;background:#0E1B2B;color:#fff;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-y:auto}
body.in #gate{display:none}
body:not(.in) header,body:not(.in) main,body:not(.in) nav{display:none}
.gin{width:100%;max-width:430px;margin:auto;padding:28px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.gin[hidden]{display:none}
.coin{perspective:700px;margin-bottom:8px}.coin img{width:170px;height:170px;display:block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.gin h1{font-size:40px;letter-spacing:-1.2px;margin:0}.gin h1 span{color:#00C896}
.gin h2{font-size:26px;letter-spacing:-.6px;margin:0}
.gin p{color:#9FB0BF;margin:0 0 8px;line-height:1.45}
.gbtn{width:100%;border:0;border-radius:14px;background:#00C896;color:#0E1B2B;padding:15px;font:700 16px inherit;font-family:inherit}
.glink{border:0;background:none;color:#00C896;font:600 15px inherit;font-family:inherit;padding:10px}
.gin label{width:100%;text-align:left;font-size:13px;color:#9FB0BF;display:block}
.gin input{width:100%;margin-top:6px;border:1px solid #2A3D52;background:#16263A;color:#fff;border-radius:12px;padding:14px;font:inherit;font-size:16px;outline:0}
.gin input:focus,.gbtn:focus-visible,.glink:focus-visible{outline:2px solid #00C896;outline-offset:2px}
.ph{display:flex;gap:8px;margin-top:6px}.ph span{flex:none;border:1px solid #2A3D52;background:#16263A;border-radius:12px;padding:14px 12px;font-size:16px}.ph input{margin:0}
.gin .back{align-self:flex-start;background:none;border:0;color:#9FB0BF;padding:4px 0}
.gin img.mini{width:64px;height:64px;border-radius:14px}
#gerr{min-height:20px;color:#FF8A80;font-size:14px;width:100%;text-align:left}
[hidden]{display:none!important}
.tc{width:100%;display:flex;gap:14px;align-items:center;text-align:left;border:1px solid #2A3D52;background:#16263A;color:#fff;border-radius:16px;padding:16px;font:inherit}
.tc b{display:block;font-size:17px;margin-bottom:2px}.tc small{color:#9FB0BF;line-height:1.35}.tc .ti{font-size:30px}
.tc:hover,.tc:focus-visible{border-color:#00C896;outline:0}
body:not(.biz) .bz{display:none}
#cust.on.thr{display:flex;flex-direction:column;min-height:100%}
.owed{background:var(--brand);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.owed .big{font-size:30px;color:var(--mint)}
.eng{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0 8px}.eng small{color:var(--mute);font-size:12px}
.seg{padding:6px 11px;font-size:12.5px}.seg.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.simnote{font-size:11.5px;color:var(--mute);width:100%}
.why{display:block;border:0;background:none;color:var(--mute);font:inherit;font-size:12.5px;padding:8px 0 0;text-decoration:underline}
.stp{display:none;font-size:12.5px;color:var(--mute);margin-top:6px}.stp.on{display:block}.stp ol{margin:4px 0 0;padding-left:18px}.stp li{margin:3px 0}
.tr{font-style:italic;margin-top:6px;font-size:14px;opacity:.9}
.mic{flex:none;width:46px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;font-size:18px}
</style>
</head>
<body>
<div id="gate">
 <div class="gin" id="g-land">
  <div class="coin"><img class="lg" alt="MoniLens logo"></div>
  <h1>Moni<span>Lens</span></h1>
  <p>Talk to your money.<br>English, Pidgin or Igbo.</p>
  <button class="gbtn" id="go-signup" type="button">Get started</button>
  <button class="glink" id="go-login" type="button">I already have an account</button>
 </div>
 <div class="gin" id="g-type" hidden>
  <button type="button" class="back" id="gback2">‹ Back</button>
  <h2>How will you use MoniLens?</h2><p>Pick one and we'll set things up to match.</p>
  <button type="button" class="tc" data-t="personal"><span class="ti">🙋</span><span><b>Personal</b><small>Track your money, save for goals and join the housing queue</small></span></button>
  <button type="button" class="tc" data-t="business"><span class="ti">🏪</span><span><b>Business</b><small>Track sales, save for stock and rent, and chat with your saved customers</small></span></button>
 </div>
 <div class="gin" id="g-form" hidden>
  <button type="button" class="back chip" id="gback">‹ Back</button>
  <img class="lg mini" alt="">
  <h2 id="gtitle"></h2><p id="gsub"></p>
  <label>Your name<input id="gname" autocomplete="given-name" placeholder="Ebeli"></label>
  <label id="bizl">Business name<input id="gbiz" placeholder="Ebeli Fabrics"></label>
  <label>Phone number<div class="ph"><span>🇳🇬 +234</span><input id="gphone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="801 234 5678"></div></label>
  <div id="gerr" role="alert"></div>
  <button type="button" class="gbtn" id="gsubmit"></button>
  <button type="button" class="glink" id="gswap"></button>
 </div>
</div>
<div id="app">
<header><img class="lg hl" alt=""><b>MoniLens</b></header>
<main>
 <section id="chat" class="pg on">
  <div class="eng" id="eng"><small>AI engine:</small><button type="button" class="chip seg" data-e="rules">Rules</button><button type="button" class="chip seg" data-e="natlas">N-ATLAS</button><button type="button" class="chip seg" data-e="hybrid">Hybrid</button><button type="button" class="chip seg" id="offb"></button><span class="simnote">Simulated demo. Not connected to the real N-ATLAS.</span></div>
  <div id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="cbar" id="f"><input id="txt" placeholder="Type a message..." autocomplete="off" aria-label="Message"><button type="button" class="mic" id="micbtn" aria-label="Send a voice note">🎤</button><button type="button" class="send" id="sendbtn" aria-label="Send">➤</button></div>
 </section>
 <section id="esc" class="pg"></section>
 <section id="save" class="pg"></section>
 <section id="cust" class="pg"></section>
 <section id="me" class="pg"></section>
</main>
<nav id="nav">
 <button data-p="chat" class="on"><span>💬</span>Chat</button>
 <button data-p="esc"><span>🛟</span>Escalate</button>
 <button data-p="save"><span>🐖</span>Save</button>
 <button data-p="cust" class="bz"><span>👥</span>Customer</button>
 <button data-p="me"><span>🙂</span>Me</button>
</nav>
</div>
<script>
const $=s=>document.querySelector(s),N=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const S={name:'Ebeli',phone:'',ai:'hybrid',off:false,type:'personal',biz:'',customers:[],cv:null,avail:84500,lang:'auto',notif:true,queue:247,
 goals:[{k:'house',e:'🏠',n:'House',saved:250000,target:8000000,m:50000},{k:'edu',e:'🎓',n:'Education',saved:120000,target:500000,m:20000}],
 tx:[['Shoprite',-12400,'Today'],['Salary',180000,'Mon'],['Bolt',-3200,'Sun'],['MTN data',-5000,'Sat']],
 tickets:[['#ML1024','Resolved'],['#ML1018','Resolved']],view:null};
const saved=()=>S.goals.reduce((a,g)=>a+g.saved,0);
let LANG='en';
/* language detection */
function detect(t){const s=t.toLowerCase();
 if(/kedu|biko|\bego\b|achọrọ|achorо|ụlọ|ulo\b|ọ dị|nke m|daalụ|\bm ga\b|ọnụ ọgụgụ|ndị/.test(s))return'ig';
 if(/how far|wetin|abeg|\bdey\b|\bwan\b|i get|i fit|\bna\b|wey|una\b|i no |wahala|for the house|how much i/.test(s))return'pg';
 return'en'}
const T={
 hi:{en:()=>'Hello! How can I help you with your money today?',pg:()=>'I dey fine! How I fit help you today?',ig:()=>'Ọ dị mma! Kedu ka m ga-esi nyere gị aka?'},
 bal:{en:()=>`You have ${N(S.avail)} available.\nYou also have ${N(saved())} in your savings goals.`,pg:()=>`You get ${N(S.avail)} available.\nYou also get ${N(saved())} for your savings goals.`,ig:()=>`Ị nwere ${N(S.avail)} dị.\nỊ nwekwara ${N(saved())} n'ọnụọgụgụ nkwụnye ego gị.`},
 tx:{en:()=>'Your recent transactions:\n'+S.tx.map(t=>`${t[2]}: ${t[0]} ${t[1]<0?'-':'+'}${N(Math.abs(t[1]))}`).join('\n'),pg:()=>'Your last transactions be these:\n'+S.tx.map(t=>`${t[2]}: ${t[0]} ${t[1]<0?'-':'+'}${N(Math.abs(t[1]))}`).join('\n'),ig:()=>'Azụmahịa gị ndị ọhụrụ:\n'+S.tx.map(t=>`${t[2]}: ${t[0]} ${t[1]<0?'-':'+'}${N(Math.abs(t[1]))}`).join('\n')},
 sp:{en:()=>`You spent ${N(96300)} this month. Food and transport took the biggest share.`,pg:()=>`You don spend ${N(96300)} this month. Food and transport chop most.`,ig:()=>`Ị mefuru ${N(96300)} n'ọnwa a. Nri na njem were ọtụtụ.`},
 sv:{en:()=>`You have ${N(saved())} across ${S.goals.length} goals:\n`+S.goals.map(g=>`${g.e} ${g.n}: ${N(g.saved)}`).join('\n'),pg:()=>`You get ${N(saved())} for ${S.goals.length} goals:\n`+S.goals.map(g=>`${g.e} ${g.n}: ${N(g.saved)}`).join('\n'),ig:()=>`Ị nwere ${N(saved())} n'ebumnuche ${S.goals.length}:\n`+S.goals.map(g=>`${g.e} ${g.n}: ${N(g.saved)}`).join('\n')},
 hg:{en:g=>`Your house goal is already active: ${N(g.saved)} saved toward ${N(g.target)}, ${N(g.m)} a month. Ask "where am I on the housing list?" to see your queue.`,pg:g=>`Your house goal don dey: ${N(g.saved)} don enter, target na ${N(g.target)}, ${N(g.m)} every month. Ask me "where I dey for house queue?"`,ig:g=>`Ebumnuche ụlọ gị na-arụ ọrụ: ${N(g.saved)} n'ime ${N(g.target)}, ${N(g.m)} kwa ọnwa.`},
 hq:{en:()=>`You're currently #${S.queue} on the housing queue.\n246 people are ahead of you. (Simulated data)`,pg:()=>`You dey #${S.queue} for the housing queue.\n246 people dey ahead of you. (Simulated data)`,ig:()=>`Ị nọ na #${S.queue} n'ahịrị ụlọ.\nMmadụ 246 nọ n'ihu gị. (Data ngosi)`},
 cg:{en:(a)=>`Done. I created a goal to save ${N(a)} every month. I'll show it on your Save tab.`,pg:(a)=>`E don set. I create goal make you save ${N(a)} every month. You fit see am for Save tab.`,ig:(a)=>`Emere ya. Emepụtara m ebumnuche ịchekwa ${N(a)} kwa ọnwa. Lee ya na Save.`},
 esc:{en:()=>`I can explain it, but if you'd prefer to speak with someone, I can escalate this conversation.`,pg:()=>`I fit explain am, but if you wan talk to person, I fit escalate am.`,ig:()=>`Enwere m ike ịkọwa ya, mana ọ bụrụ na ịchọrọ ikwu na mmadụ, m nwere ike ịkwalite ya.`},
 help:{en:()=>'I can show your balance, transactions, spending, and savings, set a savings goal, or check your housing queue.',pg:()=>'I fit show your balance, transactions, spending, savings, set savings goal, or check your housing queue.',ig:()=>'Enwere m ike igosi ego gị, azụmahịa, mmefu, nkwụnye ego, ma lelee ahịrị ụlọ.'}
};
function amt(s){const m=s.replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(k|m|million|thousand)?/i);if(!m)return null;let v=+m[1];const u=(m[2]||'').toLowerCase();if(u=='k'||u=='thousand')v*=1e3;if(u=='m'||u=='million')v*=1e6;return v}
function owedList(){return S.customers.filter(c=>c.owed>0)}
function reply(t,canon){const s=(canon||t).toLowerCase();LANG=S.lang==='auto'?detect(t):S.lang;const L=LANG,house=S.goals.find(g=>g.k=='house');
 if(S.type==='business'&&/customer|owe|debt|ndị ahịa/.test(s)){const o=owedList(),tot=o.reduce((a,c)=>a+c.owed,0),rows=o.map(c=>`${c.name}: ${N(c.owed)}`).join('\n');return[L==='pg'?`You get ${S.customers.length} customers. ${o.length} dey owe you ${N(tot)}:\n${rows}`:L==='ig'?`Ị nwere ndị ahịa ${S.customers.length}. ${o.length} ji gị ${N(tot)}:\n${rows}`:`You have ${S.customers.length} customers. ${o.length} owe you ${N(tot)}:\n${rows}`,'CUST']}
 if(S.type!=='business'&&/queue|list|position|where am i|where i dey|ebe m nọ|ahịrị/.test(s))return[T.hq[L]()];
 if(S.type!=='business'&&/house|ulo\b|ụlọ/.test(s)&&/save|want|wan|achọrọ|chekwa/.test(s))return[T.hg[L](house)];
 if(/save|chekwa/.test(s)&&/\d/.test(s)&&/month|every|kwa/.test(s)){const a=amt(s);S.goals.push({k:'g'+Date.now(),e:'💰',n:'Monthly savings',saved:0,target:a*12,m:a});render();return[T.cg[L](a)]}
 if(/human|support|agent|person|don'?t understand|no understand|aghọtaghị|nyere/.test(s))return[T.esc[L](),'ESC'];
 if(/transaction|azụmahịa|azumahia/.test(s))return[T.tx[L]()];
 if(/spen|mefu|chop/.test(s))return[T.sp[L]()];
 if(/saving|goal/.test(s))return[T.sv[L]()];
 if(/how much|much i|ego ole|balance|ego m|ego\b/.test(s))return[T.bal[L]()];
 if(/help|nyere m|\?$/.test(s)&&/help|nyere/.test(s))return[T.help[L]()];
 if(/how far|kedu|hello|hi\b|hey|good/.test(s))return[T.hi[L]()];
 return[T.help[L]()]}
/* chat */
const msgs=$('#msgs');
function add(t,c,esc,meta){const d=document.createElement('div');d.className='m '+c;d.textContent=t;
 if(esc){const b=document.createElement('button');b.className='act';b.textContent=esc==='CUST'?'Open Customers':'Escalate';b.onclick=()=>{if(esc==='CUST')go('cust');else{go('esc');openTicket()}};d.appendChild(b)}
 if(meta){const w=document.createElement('button');w.type='button';w.className='why';w.textContent='How it worked ▾';const l=document.createElement('div');l.className='stp';l.innerHTML='<b>Answered by: '+meta.engine+'</b><ol>'+meta.steps.map(x=>'<li>'+x.replace(/</g,'&lt;')+'</li>').join('')+'</ol>';w.onclick=()=>{l.classList.toggle('on');w.textContent=l.classList.contains('on')?'Hide ▴':'How it worked ▾'};d.appendChild(w);d.appendChild(l)}
 msgs.appendChild(d);d.scrollIntoView({block:'end'});return d}
function say(t){add(t,'u');respond(t,false)}
function respond(t,voice){const ty=document.createElement('div');ty.className='m b dots';ty.innerHTML='<i></i><i></i><i></i>';msgs.appendChild(ty);ty.scrollIntoView({block:'end'});
 setTimeout(()=>{ty.remove();const o=answer(t,voice);add(o.text,'b',o.flag,o.meta)},650)}
function sayVoice(t){const d=add('🎤 ▂▄▆▄▂▅▃▂▄  0:04','u');const n=document.createElement('div');n.className='tr';n.textContent='Transcribing…';d.appendChild(n);setTimeout(()=>{n.textContent='“'+t+'”';respond(t,true)},1000)}
/* AI engine switch (simulated): Rules | N-ATLAS | Hybrid */
function labelIntent(s){s=s.toLowerCase();
 if(S.type==='business'&&/customer|owe|debt|ndị ahịa/.test(s))return'CUSTOMERS';
 if(S.type!=='business'&&/queue|list|position|where am i|where i dey|ebe m nọ|ahịrị/.test(s))return'HOUSING_QUEUE';
 if(S.type!=='business'&&/house|ulo\b|ụlọ/.test(s)&&/save|want|wan|achọrọ|chekwa/.test(s))return'HOUSING_GOAL';
 if(/save|chekwa/.test(s)&&/\d/.test(s)&&/month|every|kwa/.test(s))return'CREATE_SAVINGS_GOAL';
 if(/human|support|agent|person|don'?t understand|no understand|aghọtaghị|nyere/.test(s))return'ESCALATE';
 if(/transaction|azụmahịa|azumahia/.test(s))return'TRANSACTIONS';
 if(/spen|mefu|chop/.test(s))return'SPENDING';
 if(/saving|goal/.test(s))return'SAVINGS';
 if(/how much|much i|ego ole|balance|ego m|ego\b/.test(s))return'BALANCE';
 if(/how far|kedu|hello|hi\b|hey|good/.test(s))return'GREETING';
 return'HELP'}
function fakeNat(t){const s=t.toLowerCase(),a=amt(s);
 const loose=[
  [/remain|left in|in my account|my money (be|dey)|ego fọdụrụ/,'how much do i have','BALANCE',.93],
  [/(spend|spent|use|used|mefu).*(food|transport|data|airtime|nri|njem)/,'how much did i spend','SPENDING',.9],
  [/(put|set|keep) (it )?aside|set aside/,a?`save ${a} every month`:null,'CREATE_SAVINGS_GOAL',.88],
  [/(own|buy|build|get).*(house|home)|ụlọ nke m/,'i want to save for a house','HOUSING_GOAL',.87],
  [/never pay|no pay|not pay|unpaid|debtor|who still/,'who owes me','CUSTOMERS',.9],
  [/talk to (a )?(real )?(person|human|someone)|speak to|complain|real person/,'human','ESCALATE',.92]];
 for(const [re,canon,intent,c] of loose){if(!re.test(s)||!canon)continue;if((intent==='CUSTOMERS'&&S.type!=='business')||(intent==='HOUSING_GOAL'&&S.type==='business'))continue;return{canon,conf:c,intent}}
 const i=labelIntent(s);if(i!=='HELP')return{canon:t,conf:.97,intent:i};
 return{canon:null,conf:.3,intent:'UNKNOWN'}}
function answer(t,voice){const steps=[];if(voice)steps.push(`🎤 N-ATLAS speech recognition (simulated) wrote down: “${t}”`);
 let engine='Rules',canon=null,intent;
 const useRules=()=>{engine='Rules';intent=labelIntent(t);steps.push(intent==='HELP'?'Rules looked for a matching keyword and found none':'Rules matched a keyword → intent '+intent)};
 if(S.ai==='rules')useRules();
 else if(S.off){
  if(S.ai==='natlas')return{text:"I can't reach N-ATLAS right now. Please try again, or switch to Hybrid.",flag:null,meta:{engine:'N-ATLAS (offline)',steps:steps.concat(['Tried to contact the N-ATLAS server: no answer','Engine is set to N-ATLAS only, so there is no backup'])}};
  steps.push('Tried N-ATLAS: server did not answer → using Rules as the backup');useRules();engine='Rules (backup)'}
 else{const n=fakeNat(t);
  if(S.ai==='hybrid'&&n.conf<.7){steps.push(`N-ATLAS was only ${Math.round(n.conf*100)}% sure → asked Rules too`);useRules();engine='Rules (after N-ATLAS was unsure)'}
  else{engine='N-ATLAS';canon=n.canon;steps.push(n.canon?`N-ATLAS (simulated) understood: intent ${n.intent}, ${Math.round(n.conf*100)}% sure`:`N-ATLAS was only ${Math.round(n.conf*100)}% sure → asks the user to rephrase`)}}
 const r=reply(t,canon),lang={pg:'Pidgin',ig:'Igbo',en:'English'}[LANG];
 if(engine==='N-ATLAS'&&canon)steps.push('MoniLens code (not the AI) looked up your data and did the work');
 steps.push(`Reply written in ${lang}`);
 return{text:r[0],flag:r[1],meta:{engine,steps}}}
function engUI(){document.querySelectorAll('.seg[data-e]').forEach(b=>b.classList.toggle('sel',b.dataset.e===S.ai));$('#offb').textContent=S.off?'🔴 N-ATLAS offline':'🟢 N-ATLAS online'}
document.querySelectorAll('.seg[data-e]').forEach(b=>b.onclick=()=>{S.ai=b.dataset.e;engUI()});$('#offb').onclick=()=>{S.off=!S.off;engUI()};engUI();

 const ex=S.type==='business'?[['Pidgin','Abeg, wetin remain for my account?'],['Igbo','Kedu ego m nwere?'],['Pidgin','Who never pay me?'],['English','I want to put aside 30k every month']]:[['Pidgin','Abeg, wetin remain for my account?'],['Igbo','Kedu ego m nwere?'],['Pidgin','Abeg help me get my own house'],['English','I want to put aside 30k every month']];
 ex.forEach(([lg,t])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=lg+': “'+t+'”';b.onclick=()=>{buildChips();sayVoice(t)};c.appendChild(b)});
 const x=document.createElement('button');x.type='button';x.className='chip';x.textContent='✕ Cancel';x.onclick=buildChips;c.appendChild(x)}

function sendInput(){const v=$('#txt').value.trim();if(!v)return;$('#txt').value='';say(v)}
$('#sendbtn').onclick=sendInput;$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendInput()}});
function buildChips(){const c=$('#chips');c.innerHTML='';(S.type==='business'?['How far?','How much I get?','Wetin remain for my account?','Who owes me?','Show me my transactions','I want to save ₦50k every month',"I don't understand this transaction",'Kedu?']:['How far?','How much I get?','Wetin remain for my account?','Show me my transactions','I want to save ₦50k every month','I want to save for a house','Where am I for the house?',"I don't understand this transaction",'Kedu?']).forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.type='button';b.onclick=()=>say(t);c.appendChild(b)})}

function openTicket(){ticket=[['MoniLens','Your request has been passed to support. Ticket #ML1031.']];render();setTimeout(()=>{ticket.push(['Support','Hi Ebeli, this is Ada from MoniLens support. I can see the transaction. Give me a moment.']);render()},1800)}

function goalCard(g,i){const p=Math.min(100,g.saved/g.target*100);return `<button class="card goal" onclick="S.view=${i};render()"><div class="e">${g.e}</div><div class="t"><b>${g.n}</b><div class="bar"><i style="width:${Math.max(p,2)}%"></i></div><small>${N(g.saved)} of ${N(g.target)}</small></div></button>`}
function renderSave(){const e=$('#save');
 if(S.view==='new'){e.innerHTML=`<button class="back" onclick="S.view=null;render()">‹ Back</button><h2>New goal</h2><input class="f" id="gn" placeholder="What are you saving for?"><input class="f" id="gt" inputmode="numeric" placeholder="Target amount (₦)"><input class="f" id="gm" inputmode="numeric" placeholder="Monthly amount (₦)"><button class="btn" onclick="addGoal()">Create goal</button>`;return}
 if(typeof S.view==='number'){const g=S.goals[S.view],p=Math.min(100,g.saved/g.target*100);
  e.innerHTML=`<button class="back" onclick="S.view=null;render()">‹ Back</button><h2>${g.e} ${g.n} goal</h2><div class="card"><small class="mute">Saved</small><div class="big">${N(g.saved)}</div><div class="bar"><i style="width:${Math.max(p,2)}%"></i></div><small class="mute">${p.toFixed(1)}% of target</small>
  <div class="row" style="margin-top:12px"><span>Target</span><b>${N(g.target)}</b></div><div class="row"><span>Monthly</span><b>${N(g.m)}</b></div><div class="row"><span>Next contribution</span><b>${N(g.m)}</b></div></div>
  <button class="btn" onclick="contribute(${S.view})">Add ${N(g.m)} now</button>`+(g.k=='house'?housing():'');return}
 e.innerHTML=`<h2>What are you saving for?</h2>`+S.goals.map(goalCard).join('')+`<button class="btn g" onclick="S.view='new';render()">+ New goal</button>`}
function housing(){const st=[['Savings','d'],['Financial history','d'],['Eligibility','now'],['Housing queue',''],['Housing opportunity','']];
 return `<h3>🏠 Your housing journey</h3><div class="card"><div class="steps">${st.map(s=>`<div class="st ${s[1]}"><u></u><b>${s[0]}</b></div>`).join('')}</div></div>

function addGoal(){const n=$('#gn').value.trim()||'New goal',t=+($('#gt').value.replace(/\D/g,''))||100000,m=+($('#gm').value.replace(/\D/g,''))||10000;S.goals.push({k:'g'+Date.now(),e:'🎯',n,saved:0,target:t,m});S.view=null;render()}

function seed(){const bz=S.type==='business';S.avail=bz?312400:84500;S.queue=247;S.view=null;S.cv=null;
 S.goals=bz?[{k:'stock',e:'📦',n:'Stock restock',saved:180000,target:600000,m:40000},{k:'shop',e:'🏪',n:'Shop rent',saved:90000,target:450000,m:30000}]:[{k:'house',e:'🏠',n:'House',saved:250000,target:8000000,m:50000},{k:'edu',e:'🎓',n:'Education',saved:120000,target:500000,m:20000}];

const qa=t=>t.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
const bub=m=>`<div class="m ${m.f==='me'?'u':'b'}">${m.t.replace(/</g,'&lt;')}</div>`;
function renderCust(){const e=$('#cust'),c=S.customers.find(x=>x.id===S.cv);e.classList.toggle('thr',!!c);
 if(S.cv==='new'){e.innerHTML=`<button class="back" onclick="S.cv=null;render()">‹ Back</button><h2>Add customer</h2><input class="f" id="cn" placeholder="Customer name"><input class="f" id="cp" type="tel" inputmode="tel" placeholder="Phone number"><input class="f" id="co" inputmode="numeric" placeholder="Amount they owe you (₦, optional)"><button class="btn" onclick="addCust()">Save customer</button>`;return}
 if(c){const fn=c.name.split(' ')[0];e.innerHTML=`<button class="back" onclick="S.cv=null;render()">‹ Customers</button>
 <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div><b>${c.name}</b><br><small class="mute">${c.phone}</small></div><div style="text-align:right"><small class="mute">Owes you</small><br><b>${N(c.owed)}</b>${c.owed?`<br><button class="chip" style="margin-top:6px" onclick="paid('${c.id}')">Mark paid</button>`:''}</div></div>
 <div id="cm" style="flex:1;display:flex;flex-direction:column;gap:8px;padding-bottom:8px">${c.msgs.length?c.msgs.map(bub).join(''):'<p class="mute" style="text-align:center">No messages yet. Say hello 👋</p>'}</div>
 <div class="chips"><button class="chip" onclick="csend('${qa(`Hello ${fn}, a friendly reminder that ${c.owed?N(c.owed):'your balance'} is outstanding. Thank you! - ${S.biz}`)}')">Payment reminder</button><button class="chip" onclick="csend('${qa(`Thank you for your business, ${fn}!`)}')">Thank you</button><button class="chip" onclick="csend('You can pay to my account. I will send the details now.')">Share account details</button></div>
 <div class="cbar"><input id="ci" onkeydown="if(event.key==='Enter'){event.preventDefault();csend(this.value);this.value=''}" placeholder="Message ${fn}..." autocomplete="off" aria-label="Message customer"><button type="button" class="send" onclick="const i=document.getElementById('ci');csend(i.value);i.value=''" aria-label="Send">➤</button></div>`;
  const cm=$('#cm');cm.lastElementChild&&cm.lastElementChild.scrollIntoView({block:'end'});return}
 const tot=S.customers.reduce((a,c)=>a+c.owed,0);
 e.innerHTML=`<h2>Customers</h2><div class="owed"><small>Owed to you</small><div class="big">${N(tot)}</div><small>${S.customers.filter(c=>c.owed>0).length} of ${S.customers.length} customers owe you</small></div>`+
 (S.customers.length?S.customers.map(c=>{const l=c.msgs[c.msgs.length-1];return `<button class="card goal" onclick="S.cv='${c.id}';render()"><div class="e">${c.name[0]}</div><div class="t"><b>${c.name}</b><br><small>${l?l.t.slice(0,40):c.phone}</small></div>${c.owed?`<span class="tag">${N(c.owed)}</span>`:''}</button>`}).join(''):'<p class="mute">No customers yet. Add your first one.</p>')+

function addCust(){const n=$('#cn').value.trim();if(n.length<2)return;S.customers.push({id:'c'+Date.now(),name:n,phone:$('#cp').value.trim()||'No phone',owed:+($('#co').value.replace(/\D/g,''))||0,msgs:[]});S.cv=null;render()}
function paid(id){const c=S.customers.find(x=>x.id===id);c.owed=0;c.msgs.push({f:'me',t:'Payment received, thank you!'});render()}
function csend(t){t=t.trim();const c=S.customers.find(x=>x.id===S.cv);if(!t||!c)return;const cm=$('#cm');if(cm&&!c.msgs.length)cm.innerHTML='';c.msgs.push({f:'me',t});if(cm){cm.insertAdjacentHTML('beforeend',bub({f:'me',t}));cm.lastElementChild.scrollIntoView({block:'end'})}
 setTimeout(()=>{const r=/remind|outstanding|owe/i.test(t)?'Okay, I will send it by Friday 🙏':/account/i.test(t)?'Received, thanks!':/thank/i.test(t)?'You are welcome!':'Okay, noted 👍';c.msgs.push({f:'them',t:r});if(S.cv===c.id){const m=$('#cm');m.insertAdjacentHTML('beforeend',bub({f:'them',t:r}));m.lastElementChild.scrollIntoView({block:'end'})}},900)}
let mode='signup',pick='personal';
const normPhone=v=>{let d=v.replace(/\D/g,'');if(d.startsWith('234'))d=d.slice(3);if(d.startsWith('0'))d=d.slice(1);return d};
const fmtPhone=d=>'+234 '+d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6);
const cap=n=>n.trim().split(/\s+/)[0].replace(/^./,c=>c.toUpperCase());
function gateTo(m){mode=m;const f=m==='signup'||m==='login';$('#g-land').hidden=m!=='land';$('#g-type').hidden=m!=='type';$('#g-form').hidden=!f;if(!f)return;$('#gerr').textContent='';
 const su=m==='signup',bz=su&&pick==='business';$('#bizl').hidden=!bz;
 $('#gtitle').textContent=su?(bz?'Create your business account':'Create your account'):'Welcome back';$('#gsub').textContent=su?(bz?'Your name, business name and phone number.':'Just your name and phone number.'):'Log in with your name and phone number.';
 $('#gsubmit').textContent=su?'Create account':'Log in';$('#gswap').textContent=su?'I already have an account':'New here? Create account';$('#gname').focus()}
$('#go-signup').onclick=()=>gateTo('type');$('#go-login').onclick=()=>gateTo('login');
document.querySelectorAll('.tc').forEach(b=>b.onclick=()=>{pick=b.dataset.t;gateTo('signup')});
$('#gswap').onclick=()=>gateTo(mode==='signup'?'login':'type');
$('#gback').onclick=()=>gateTo(mode==='signup'?'type':'land');$('#gback2').onclick=()=>gateTo('land');
function enter(a){S.type=a.type||'personal';S.biz=a.biz||'';seed();document.body.classList.toggle('biz',S.type==='business');buildChips();S.name=cap(a.name);S.phone=fmtPhone(a.phone);document.body.classList.add('in');ls.set('ml_in','1');greet();go('chat')}
function gateSubmit(){const name=$('#gname').value,ph=normPhone($('#gphone').value),err=$('#gerr');
 if(name.trim().length<2){err.textContent='Please enter your name.';return}
 if(!/^[789]\d{9}$/.test(ph)){err.textContent='Enter a valid Nigerian phone number, like 801 234 5678.';return}
 const biz=$('#gbiz').value.trim();if(mode==='signup'&&pick==='business'&&biz.length<2){err.textContent='Please enter your business name.';return}
 const a={name:name.trim(),phone:ph,type:mode==='signup'?pick:'personal',biz};
 if(mode==='signup'){ls.set('ml_acct',JSON.stringify(a));enter(a);return}
 let saved=null;try{saved=JSON.parse(ls.get('ml_acct'))}catch{}
 if(!saved||saved.phone!==ph){err.textContent="We couldn't find an account with that number. Create one instead?";return}
 if(cap(saved.name).toLowerCase()!==cap(name).toLowerCase()){err.textContent='That name does not match this number. Try again.';return}
 enter(saved)}
$('#gsubmit').onclick=gateSubmit;
$('#g-form').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();gateSubmit()}});
function logout(){ls.del('ml_in');$('#gbiz').value='';document.body.classList.remove('in');$('#gname').value='';$('#gphone').value='';gateTo('login')}
(function init(){let a=null;try{a=JSON.parse(ls.get('ml_acct'))}catch{}
 if(a&&ls.get('ml_in')==='1')enter(a);else if(a)gateTo('login');else gateTo('land')})();
</script>
</body>
</html>
